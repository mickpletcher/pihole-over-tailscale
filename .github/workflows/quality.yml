name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes dnsutils jq ripgrep shellcheck unzip zip

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md" "!prompts/**"

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh scripts/lib/*.sh tests/*.sh

      - name: Run safe tests and internal-link checks
        run: bash tests/run-tests.sh

      - name: Check committed whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Scan secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
